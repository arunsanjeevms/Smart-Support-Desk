<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>{{ subject }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background: #f4f6f8; -webkit-text-size-adjust: 100%; }
    table { border-collapse: collapse; }
    a { color: #0f766e; }
    @media (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 22px !important; padding-right: 22px !important; }
      .stack td { display: block !important; width: 100% !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;">
  {# Preview text shown next to the subject in the inbox #}
  <div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all;">{% block preheader %}{% endblock %}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;">
    <tr>
      <td align="center" style="padding:32px 12px 24px;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;">

          <!-- Brand -->
          <tr>
            <td style="padding:0 4px 18px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="34" height="34" align="center" valign="middle" style="width:34px;height:34px;background:#0f766e;border-radius:9px;color:#ffffff;font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;font-weight:600;line-height:34px;">&#10003;</td>
                  <td style="padding-left:11px;font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;color:#101828;letter-spacing:-0.1px;">{{ brand }}</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background:#ffffff;border:1px solid #e4e7ec;border-radius:14px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr><td style="height:4px;line-height:4px;font-size:0;background:#0f766e;border-radius:14px 14px 0 0;">&nbsp;</td></tr>
                <tr>
                  <td class="px" style="padding:34px 40px 36px;font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;color:#344054;font-size:14px;line-height:1.65;">
                    {% block content %}{% endblock %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:22px 16px 0;text-align:center;font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.7;color:#98a2b3;">
              {% block footer %}{% endblock %}<br>
              <a href="{{ app_url }}" style="color:#667085;text-decoration:underline;">{{ brand }}</a> &middot; Raise, track and resolve support tickets
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
