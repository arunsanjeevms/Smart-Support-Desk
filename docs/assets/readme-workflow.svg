<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">How a ticket moves through Smart Support Desk</title>
  <desc id="flow-desc">Animated flow: a requester raises a ticket with files, the AI suggests the category and similar fixes, the ticket is Open, an agent moves it to In Progress, and it is Resolved with a required note. Every step is written to the activity log and can send an e-mail.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7faf9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset=".25" stop-color="#14b8a6"/>
      <stop offset=".5" stop-color="#2563eb"/>
      <stop offset=".75" stop-color="#d97706"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".45" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .f { font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .c { transform-box: fill-box; transform-origin: center; }
    .track { stroke-dasharray: 8 10; animation: flow 1.2s linear infinite; }
    .node { animation: node 10s ease-in-out infinite; }
    .n1 { animation-delay: 0s; }
    .n2 { animation-delay: 2s; }
    .n3 { animation-delay: 4s; }
    .n4 { animation-delay: 6s; }
    .n5 { animation-delay: 8s; }
    .halo { animation: halo 10s ease-out infinite; opacity: 0; }
    .h1 { animation-delay: 0s; }
    .h2 { animation-delay: 2s; }
    .h3 { animation-delay: 4s; }
    .h4 { animation-delay: 6s; }
    .h5 { animation-delay: 8s; }
    .in1 { animation: rise .6s ease-out .1s both; }
    .in2 { animation: rise .6s ease-out .25s both; }
    .in3 { animation: rise .6s ease-out .4s both; }
    .in4 { animation: rise .6s ease-out .55s both; }
    .in5 { animation: rise .6s ease-out .7s both; }
    .foot { animation: rise .6s ease-out 1s both; }
    .spin { animation: spin 3s linear infinite; }

    @keyframes flow { to { stroke-dashoffset: -36; } }
    @keyframes node { 0%,16%,100% { transform: translateY(0); } 6%,10% { transform: translateY(-6px); } }
    @keyframes halo { 0% { opacity: .55; transform: scale(.9); } 14% { opacity: 0; transform: scale(1.5); } 100% { opacity: 0; transform: scale(1.5); } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .halo { opacity: 0; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#card)" stroke="#e4e7ec" stroke-width="2"/>

  <text class="f" x="40" y="46" font-size="12" font-weight="600" letter-spacing="2" fill="#0f766e">THE LIFE OF A TICKET</text>
  <text class="f" x="40" y="70" font-size="19" font-weight="600" fill="#101828">From the first report to a confirmed fix</text>

  <!-- Connecting line with flowing dashes and a travelling pulse -->
  <path d="M130 150 H1070" fill="none" stroke="#e4e7ec" stroke-width="6" stroke-linecap="round"/>
  <path class="track" d="M130 150 H1070" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <circle r="11" fill="url(#pulse)">
    <animateMotion dur="10s" repeatCount="indefinite" path="M130 150 H1070" keyPoints="0;0;.25;.25;.5;.5;.75;.75;1;1" keyTimes="0;.12;.2;.32;.4;.52;.6;.72;.8;1" calcMode="linear"/>
  </circle>

  <!-- 1. Raise -->
  <g class="in1">
    <circle class="halo h1 c" cx="130" cy="150" r="34" fill="none" stroke="#0f766e" stroke-width="3"/>
    <g class="node n1">
      <circle cx="130" cy="150" r="30" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
      <path d="M130 138v24M118 150h24" stroke="#0f766e" stroke-width="3.5" stroke-linecap="round"/>
      <text class="f" x="130" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#101828">Raise</text>
      <text class="f" x="130" y="232" text-anchor="middle" font-size="12" fill="#667085">title, description</text>
      <text class="f" x="130" y="249" text-anchor="middle" font-size="12" fill="#667085">+ screenshots, logs</text>
    </g>
  </g>

  <!-- 2. AI assist -->
  <g class="in2">
    <circle class="halo h2 c" cx="365" cy="150" r="34" fill="none" stroke="#14b8a6" stroke-width="3"/>
    <g class="node n2">
      <circle cx="365" cy="150" r="30" fill="#0d2024" stroke="#14b8a6" stroke-width="3"/>
      <path d="M365 133l4.5 10.5 10.5 4.5-10.5 4.5-4.5 10.5-4.5-10.5-10.5-4.5 10.5-4.5z" fill="#5eead4"/>
      <text class="f" x="365" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#101828">Local AI helps</text>
      <text class="f" x="365" y="232" text-anchor="middle" font-size="12" fill="#667085">suggests the category</text>
      <text class="f" x="365" y="249" text-anchor="middle" font-size="12" fill="#667085">finds similar fixes</text>
    </g>
  </g>

  <!-- 3. Open -->
  <g class="in3">
    <circle class="halo h3 c" cx="600" cy="150" r="34" fill="none" stroke="#2563eb" stroke-width="3"/>
    <g class="node n3">
      <circle cx="600" cy="150" r="30" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <circle cx="600" cy="150" r="10" fill="none" stroke="#2563eb" stroke-width="3"/>
      <text class="f" x="600" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#101828">Open</text>
      <text class="f" x="600" y="232" text-anchor="middle" font-size="12" fill="#667085">SSD-1027 in the queue</text>
      <text class="f" x="600" y="249" text-anchor="middle" font-size="12" fill="#667085">agents are alerted</text>
    </g>
  </g>

  <!-- 4. In Progress -->
  <g class="in4">
    <circle class="halo h4 c" cx="835" cy="150" r="34" fill="none" stroke="#d97706" stroke-width="3"/>
    <g class="node n4">
      <circle cx="835" cy="150" r="30" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
      <g class="spin c">
        <path d="M823 150a12 12 0 0 1 20.5-8.5" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
        <path d="M847 150a12 12 0 0 1-20.5 8.5" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
        <path d="M843.5 135.5v6.5h-6.5M826.5 164.5v-6.5h6.5" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text class="f" x="835" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#101828">In Progress</text>
      <text class="f" x="835" y="232" text-anchor="middle" font-size="12" fill="#667085">auto-assigned to the agent</text>
      <text class="f" x="835" y="249" text-anchor="middle" font-size="12" fill="#667085">comments both ways</text>
    </g>
  </g>

  <!-- 5. Resolved -->
  <g class="in5">
    <circle class="halo h5 c" cx="1070" cy="150" r="34" fill="none" stroke="#16a34a" stroke-width="3"/>
    <g class="node n5">
      <circle cx="1070" cy="150" r="30" fill="#ecfdf3" stroke="#16a34a" stroke-width="3"/>
      <path d="M1058 150l8 8 16-17" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="f" x="1070" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#101828">Resolved</text>
      <text class="f" x="1070" y="232" text-anchor="middle" font-size="12" fill="#667085">resolution note required</text>
      <text class="f" x="1070" y="249" text-anchor="middle" font-size="12" fill="#667085">requester is e-mailed</text>
    </g>
  </g>

  <!-- Footer -->
  <g class="foot f" font-size="12.5" fill="#475467">
    <rect x="700" y="28" width="460" height="52" rx="12" fill="#f2f8f7" stroke="#d6ece8"/>
    <circle cx="722" cy="54" r="4" fill="#14b8a6"/>
    <text x="734" y="51">Every step is written to the <tspan font-weight="600" fill="#0f766e">activity log</tspan>,</text>
    <text x="734" y="68">can send an <tspan font-weight="600" fill="#0f766e">e-mail</tspan> and shows up in <tspan font-weight="600" fill="#0f766e">exports</tspan>.</text>
  </g>
</svg>
