<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="ai-title ai-desc">
  <title id="ai-title">Different wording, same problem</title>
  <desc id="ai-desc">Animated diagram: the new issue "The analytics page is painfully slow to open" and the resolved ticket "Dashboard takes more than a minute to load" share almost no words, but the local model turns both into 384-number embeddings with a similar shape. Their cosine similarity is 0.68, a strong match, while keyword matching scores only 0.10.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2024"/>
      <stop offset="1" stop-color="#0a171a"/>
    </linearGradient>
    <pattern id="stripes2" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="1" height="14" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
    <linearGradient id="teal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <clipPath id="frame2">
      <rect width="1200" height="330" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .f { font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .b { transform-box: fill-box; transform-origin: bottom center; }
    .l { transform-box: fill-box; transform-origin: left center; }
    .c { transform-box: fill-box; transform-origin: center; }

    .cardA { animation: in-left .7s cubic-bezier(.2,.7,.2,1) .1s both; }
    .cardB { animation: in-right .7s cubic-bezier(.2,.7,.2,1) .3s both; }
    .bars rect { animation: bar 8s cubic-bezier(.2,.7,.2,1) infinite; }
    .arrow { stroke-dasharray: 6 8; animation: dash 1s linear infinite; }
    .gauge-fill { animation: gauge 8s cubic-bezier(.2,.7,.2,1) infinite; transform: scaleX(0); }
    .score { opacity: 0; }
    .s1 { animation: s1 8s linear infinite; }
    .s2 { animation: s2 8s linear infinite; }
    .s3 { animation: s3 8s linear infinite; }
    .s4 { animation: s4 8s linear infinite; }
    .badge { animation: badge 8s ease-out infinite; opacity: 0; }
    .kw { animation: kw 8s ease-out infinite; opacity: 0; }

    @keyframes in-left { from { opacity: 0; transform: translateX(-30px); } }
    @keyframes in-right { from { opacity: 0; transform: translateX(30px); } }
    @keyframes bar { 0%,6% { transform: scaleY(0); } 26%,90% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @keyframes gauge { 0%,30% { transform: scaleX(0); } 52%,90% { transform: scaleX(.68); } 100% { transform: scaleX(0); } }
    @keyframes s1 { 0%,32% { opacity: 0; } 34%,38% { opacity: 1; } 40%,100% { opacity: 0; } }
    @keyframes s2 { 0%,38% { opacity: 0; } 40%,44% { opacity: 1; } 46%,100% { opacity: 0; } }
    @keyframes s3 { 0%,44% { opacity: 0; } 46%,50% { opacity: 1; } 52%,100% { opacity: 0; } }
    @keyframes s4 { 0%,50% { opacity: 0; } 52%,90% { opacity: 1; } 96%,100% { opacity: 0; } }
    @keyframes badge { 0%,54% { opacity: 0; transform: translateY(8px); } 60%,90% { opacity: 1; transform: translateY(0); } 96%,100% { opacity: 0; } }
    @keyframes kw { 0%,62% { opacity: 0; transform: translateY(8px); } 68%,90% { opacity: 1; transform: translateY(0); } 96%,100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .gauge-fill { transform: scaleX(.68); }
      .s4, .badge, .kw { opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame2)">
    <rect width="1200" height="330" fill="url(#bg2)"/>
    <rect width="1200" height="330" fill="url(#stripes2)"/>

    <text class="f" x="40" y="44" font-size="12" font-weight="600" letter-spacing="2" fill="#5eead4">LOCAL AI · ALL-MINILM-L6-V2</text>
    <text class="f" x="40" y="70" font-size="20" font-weight="600" fill="#ffffff">Different wording, same problem</text>

    <!-- New issue -->
    <g class="cardA">
      <rect x="40" y="96" width="330" height="96" rx="16" fill="#ffffff" fill-opacity=".97"/>
      <text class="f" x="60" y="122" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#2563eb">NEW ISSUE</text>
      <text class="f" x="60" y="148" font-size="15" font-weight="600" fill="#101828">The analytics page is</text>
      <text class="f" x="60" y="170" font-size="15" font-weight="600" fill="#101828">painfully slow to open</text>
    </g>

    <!-- Resolved ticket -->
    <g class="cardB">
      <rect x="830" y="96" width="330" height="96" rx="16" fill="#ffffff" fill-opacity=".97"/>
      <text class="f" x="850" y="122" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#16a34a">RESOLVED · SSD-1002</text>
      <text class="f" x="850" y="148" font-size="15" font-weight="600" fill="#101828">Dashboard takes more than</text>
      <text class="f" x="850" y="170" font-size="15" font-weight="600" fill="#101828">a minute to load</text>
    </g>

    <!-- Arrows into the model -->
    <path class="arrow" d="M370 144 H430" stroke="#5eead4" stroke-width="2.5" fill="none"/>
    <path class="arrow" d="M830 144 H770" stroke="#5eead4" stroke-width="2.5" fill="none"/>

    <!-- Embeddings: similar shapes for both texts -->
    <rect x="440" y="96" width="320" height="96" rx="16" fill="#ffffff" fill-opacity=".05" stroke="#5eead4" stroke-opacity=".3"/>
    <text class="f" x="600" y="116" text-anchor="middle" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#5eead4">384-NUMBER EMBEDDINGS</text>
    <g class="bars">
      <rect class="b" x="462" y="140" width="9" height="32" rx="2" fill="url(#teal)" style="animation-delay:.00s"/>
      <rect class="b" x="476" y="150" width="9" height="22" rx="2" fill="url(#teal)" style="animation-delay:.04s"/>
      <rect class="b" x="490" y="132" width="9" height="40" rx="2" fill="url(#teal)" style="animation-delay:.08s"/>
      <rect class="b" x="504" y="156" width="9" height="16" rx="2" fill="url(#teal)" style="animation-delay:.12s"/>
      <rect class="b" x="518" y="144" width="9" height="28" rx="2" fill="url(#teal)" style="animation-delay:.16s"/>
      <rect class="b" x="532" y="128" width="9" height="44" rx="2" fill="url(#teal)" style="animation-delay:.20s"/>
      <rect class="b" x="546" y="152" width="9" height="20" rx="2" fill="url(#teal)" style="animation-delay:.24s"/>
      <rect class="b" x="560" y="138" width="9" height="34" rx="2" fill="url(#teal)" style="animation-delay:.28s"/>
      <rect class="b" x="632" y="142" width="9" height="30" rx="2" fill="#93c5fd" style="animation-delay:.10s"/>
      <rect class="b" x="646" y="152" width="9" height="20" rx="2" fill="#93c5fd" style="animation-delay:.14s"/>
      <rect class="b" x="660" y="130" width="9" height="42" rx="2" fill="#93c5fd" style="animation-delay:.18s"/>
      <rect class="b" x="674" y="158" width="9" height="14" rx="2" fill="#93c5fd" style="animation-delay:.22s"/>
      <rect class="b" x="688" y="146" width="9" height="26" rx="2" fill="#93c5fd" style="animation-delay:.26s"/>
      <rect class="b" x="702" y="132" width="9" height="40" rx="2" fill="#93c5fd" style="animation-delay:.30s"/>
      <rect class="b" x="716" y="150" width="9" height="22" rx="2" fill="#93c5fd" style="animation-delay:.34s"/>
      <rect class="b" x="730" y="140" width="9" height="32" rx="2" fill="#93c5fd" style="animation-delay:.38s"/>
    </g>
    <text class="f" x="600" y="164" text-anchor="middle" font-size="18" font-weight="700" fill="#5eead4">≈</text>

    <!-- Cosine similarity gauge -->
    <text class="f" x="440" y="236" font-size="13" fill="#ffffff" fill-opacity=".7">Cosine similarity</text>
    <rect x="440" y="248" width="320" height="10" rx="5" fill="#ffffff" fill-opacity=".1"/>
    <rect class="gauge-fill l" x="440" y="248" width="320" height="10" rx="5" fill="url(#gauge)"/>
    <line x1="552" y1="244" x2="552" y2="262" stroke="#ffffff" stroke-opacity=".35" stroke-dasharray="2 3"/>
    <text class="f" x="552" y="280" text-anchor="middle" font-size="10.5" fill="#ffffff" fill-opacity=".5">0.35 minimum</text>
    <g class="f" font-size="26" font-weight="700" fill="#ffffff">
      <text class="score s1" x="760" y="240" text-anchor="end">0.21</text>
      <text class="score s2" x="760" y="240" text-anchor="end">0.43</text>
      <text class="score s3" x="760" y="240" text-anchor="end">0.59</text>
      <text class="score s4" x="760" y="240" text-anchor="end">0.68</text>
    </g>

    <!-- Results -->
    <g class="badge">
      <rect x="830" y="216" width="330" height="40" rx="12" fill="#ecfdf3"/>
      <path d="M850 236l6 6 11-12" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="f" x="878" y="241" font-size="14" font-weight="600" fill="#15803d">Strong match · suggested first</text>
    </g>
    <g class="kw">
      <rect x="830" y="266" width="330" height="40" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
      <path d="M851 280l12 12M863 280l-12 12" stroke="#f87171" stroke-width="2.6" stroke-linecap="round"/>
      <text class="f" x="878" y="291" font-size="13" fill="#ffffff" fill-opacity=".75">Keyword matching: 0.10 · missed</text>
    </g>

    <text class="f" x="40" y="236" font-size="13" fill="#ffffff" fill-opacity=".7">Runs inside Django on the CPU.</text>
    <text class="f" x="40" y="256" font-size="13" fill="#ffffff" fill-opacity=".7">No ticket text leaves the server.</text>
    <text class="f" x="40" y="290" font-size="12" fill="#5eead4" fill-opacity=".85">Suggestions are advisory - never applied automatically.</text>
  </g>
</svg>
