<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Smart Support Desk</title>
  <desc id="banner-desc">Animated banner: the Smart Support Desk logo, the tagline "Raise, track and resolve tickets with local AI", the tech stack, and a small ticket board where a ticket moves from Open to In Progress to Resolved while the AI shows a 74% similar match and a suggested category.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2024"/>
      <stop offset="1" stop-color="#0a171a"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="1" height="14" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="380" rx="26"/>
    </clipPath>
    <clipPath id="type-clip">
      <rect x="72" y="236" width="0" height="34">
        <animate attributeName="width" from="0" to="512" begin="1.3s" dur="2.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .f { font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .c { transform-box: fill-box; transform-origin: center; }
    .l { transform-box: fill-box; transform-origin: left center; }

    .glow { animation: glow 7s ease-in-out infinite; }
    .tile { animation: pop .7s cubic-bezier(.34,1.56,.64,1) both; }
    .tick { stroke-dasharray: 46; stroke-dashoffset: 46; animation: draw .6s ease-out .5s forwards; }
    .ring { animation: ring 3.2s ease-out 1s infinite; opacity: 0; }
    .rise1 { animation: rise .7s ease-out .35s both; }
    .rise2 { animation: rise .7s ease-out .55s both; }
    .bar { animation: grow .9s cubic-bezier(.2,.7,.2,1) 1s both; }
    .caret { animation: caret-move 2.4s linear 1.3s both, blink 1s step-end 3.7s infinite; }
    .chip1 { animation: rise .5s ease-out 3.6s both; }
    .chip2 { animation: rise .5s ease-out 3.75s both; }
    .chip3 { animation: rise .5s ease-out 3.9s both; }
    .chip4 { animation: rise .5s ease-out 4.05s both; }

    .board { animation: slide-in .9s cubic-bezier(.2,.7,.2,1) .4s both; }
    .float1 { animation: float 6s ease-in-out 1.4s infinite; }
    .float2 { animation: float 6s ease-in-out 2.4s infinite; }
    .float3 { animation: float 6s ease-in-out 3.4s infinite; }

    .st-open { animation: st-open 9s linear 1.5s infinite; }
    .st-prog { animation: st-prog 9s linear 1.5s infinite; opacity: 0; }
    .st-done { animation: st-done 9s linear 1.5s infinite; opacity: 0; }
    .ai-fill { animation: fill 9s cubic-bezier(.2,.7,.2,1) 1.5s infinite; transform: scaleX(0); }
    .pct { animation: pct 9s linear 1.5s infinite; opacity: 0; }
    .spark { animation: spark 2.4s ease-in-out infinite; }
    .dot { animation: blink-dot 1.6s ease-in-out infinite; }

    @keyframes glow { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes pop { from { opacity: 0; transform: scale(.5) rotate(-10deg); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes ring { 0% { opacity: .8; transform: scale(1); } 70%,100% { opacity: 0; transform: scale(1.9); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes caret-move { from { transform: translateX(0); } to { transform: translateX(506px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes slide-in { from { opacity: 0; transform: translateX(40px); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes st-open { 0%,30% { opacity: 1; } 33%,97% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes st-prog { 0%,30% { opacity: 0; } 33%,63% { opacity: 1; } 66%,100% { opacity: 0; } }
    @keyframes st-done { 0%,63% { opacity: 0; } 66%,97% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes fill { 0%,8% { transform: scaleX(0); } 30%,90% { transform: scaleX(.74); } 100% { transform: scaleX(0); } }
    @keyframes pct { 0%,26% { opacity: 0; } 32%,90% { opacity: 1; } 96%,100% { opacity: 0; } }
    @keyframes spark { 0%,100% { transform: scale(1) rotate(0deg); opacity: .9; } 50% { transform: scale(1.18) rotate(18deg); opacity: 1; } }
    @keyframes blink-dot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .tick { stroke-dashoffset: 0; }
      .ring, .st-prog, .st-done { opacity: 0; }
      .caret { opacity: 0; }
      .ai-fill { transform: scaleX(.74); }
      .pct { opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- Background: the app's dark sidebar look - deep teal, fine pinstripes and a soft glow -->
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#stripes)"/>
    <ellipse class="glow c" cx="300" cy="170" rx="420" ry="250" fill="url(#glow)"/>
    <ellipse class="glow c" cx="960" cy="230" rx="300" ry="220" fill="url(#glow)" opacity=".6"/>

    <!-- Logo: teal tile with a check mark that draws itself -->
    <rect class="ring c" x="72" y="56" width="68" height="68" rx="18" fill="none" stroke="#5eead4" stroke-width="2"/>
    <g class="tile c">
      <rect x="72" y="56" width="68" height="68" rx="18" fill="url(#tile)"/>
      <path class="tick" d="M90 91l11 11 21-24" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="f rise1" x="160" y="85" font-size="13" font-weight="600" letter-spacing="2.4" fill="#5eead4">OPEN-SOURCE HELP DESK</text>
    <text class="f rise1" x="160" y="111" font-size="15" fill="#ffffff" fill-opacity=".62">Angular · Django · MongoDB · local AI</text>

    <!-- Title -->
    <text class="f rise2" x="70" y="196" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1.2">Smart Support Desk</text>
    <rect class="bar l" x="72" y="214" width="120" height="5" rx="2.5" fill="url(#meter)"/>

    <!-- Tagline, typed out -->
    <g clip-path="url(#type-clip)">
      <text class="f" x="72" y="259" font-size="21" fill="#ffffff" fill-opacity=".86">Raise, track and resolve tickets with local AI</text>
    </g>
    <rect class="caret" x="74" y="240" width="2.5" height="26" rx="1" fill="#5eead4"/>

    <!-- Tech chips -->
    <g class="f" font-size="13" font-weight="500">
      <g class="chip1">
        <rect x="72" y="296" width="104" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="92" cy="312" r="5" fill="#f43f5e"/>
        <text x="104" y="317" fill="#ffffff" fill-opacity=".86">Angular 21</text>
      </g>
      <g class="chip2">
        <rect x="186" y="296" width="98" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="206" cy="312" r="5" fill="#34d399"/>
        <text x="218" y="317" fill="#ffffff" fill-opacity=".86">Django 6</text>
      </g>
      <g class="chip3">
        <rect x="294" y="296" width="114" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="314" cy="312" r="5" fill="#4ade80"/>
        <text x="326" y="317" fill="#ffffff" fill-opacity=".86">MongoDB 8</text>
      </g>
      <g class="chip4">
        <rect x="418" y="296" width="198" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
        <circle cx="438" cy="312" r="5" fill="#fbbf24"/>
        <text x="450" y="317" fill="#ffffff" fill-opacity=".86">Sentence Transformers</text>
      </g>
    </g>

    <!-- Mini ticket board -->
    <g class="board">
      <!-- Ticket card with a status that moves Open -> In Progress -> Resolved -->
      <g class="float1">
        <rect x="720" y="52" width="410" height="98" rx="16" fill="#ffffff" fill-opacity=".96"/>
        <rect x="738" y="70" width="70" height="22" rx="6" fill="#f2f4f7" stroke="#e4e7ec"/>
        <text class="f" x="747" y="85" font-size="11.5" font-weight="600" fill="#475467">SSD-1027</text>
        <text class="f" x="738" y="122" font-size="16" font-weight="600" fill="#101828">Analytics page is painfully slow</text>
        <text class="f" x="738" y="140" font-size="12" fill="#667085">Performance · High · raised by Riya</text>
        <g class="st-open">
          <rect x="1010" y="68" width="100" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
          <circle cx="1028" cy="81" r="4.5" fill="none" stroke="#2563eb" stroke-width="2"/>
          <text class="f" x="1040" y="86" font-size="12.5" font-weight="600" fill="#1d4ed8">Open</text>
        </g>
        <g class="st-prog">
          <rect x="1000" y="68" width="110" height="26" rx="13" fill="#fffbeb" stroke="#fde68a"/>
          <circle cx="1018" cy="81" r="4.5" fill="#d97706"/>
          <text class="f" x="1029" y="86" font-size="12.5" font-weight="600" fill="#b45309">In Progress</text>
        </g>
        <g class="st-done">
          <rect x="1006" y="68" width="104" height="26" rx="13" fill="#ecfdf3" stroke="#abefc6"/>
          <path d="M1019 81l3.5 3.5 6.5-7" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <text class="f" x="1034" y="86" font-size="12.5" font-weight="600" fill="#15803d">Resolved</text>
        </g>
      </g>

      <!-- AI: similar resolved ticket -->
      <g class="float2">
        <rect x="760" y="166" width="370" height="84" rx="16" fill="#0f2a2e" stroke="#5eead4" stroke-opacity=".45"/>
        <g class="spark c">
          <path d="M786 186l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#5eead4"/>
        </g>
        <text class="f" x="806" y="197" font-size="13" font-weight="600" fill="#5eead4">Similar resolved ticket</text>
        <text class="f" x="780" y="222" font-size="14" fill="#ffffff" fill-opacity=".9">Dashboard takes more than a minute to load</text>
        <rect x="780" y="233" width="250" height="6" rx="3" fill="#ffffff" fill-opacity=".12"/>
        <rect class="ai-fill l" x="780" y="233" width="250" height="6" rx="3" fill="url(#meter)"/>
        <text class="f pct" x="1042" y="241" font-size="13" font-weight="700" fill="#5eead4">74% match</text>
      </g>

      <!-- AI: suggested category + attachment -->
      <g class="float3">
        <rect x="720" y="266" width="250" height="62" rx="16" fill="#ffffff" fill-opacity=".96"/>
        <circle class="dot" cx="742" cy="297" r="5" fill="#0f766e"/>
        <text class="f" x="756" y="292" font-size="11.5" font-weight="600" fill="#0f766e">SUGGESTED CATEGORY</text>
        <text class="f" x="756" y="312" font-size="14.5" font-weight="600" fill="#101828">Performance</text>
        <rect x="898" y="292" width="58" height="24" rx="8" fill="#e8f6f4" stroke="#b7e2dc"/>
        <text class="f" x="908" y="308" font-size="12" font-weight="600" fill="#0f766e">Use it</text>

        <rect x="984" y="266" width="146" height="62" rx="16" fill="#ffffff" fill-opacity=".96"/>
        <rect x="1000" y="282" width="30" height="30" rx="7" fill="#e8f6f4"/>
        <path d="M1009 302l5-6 4 4 3-3 4 5z" fill="#0f766e"/>
        <circle cx="1021" cy="290" r="2.4" fill="#14b8a6"/>
        <text class="f" x="1038" y="294" font-size="12" font-weight="600" fill="#101828">error.png</text>
        <text class="f" x="1038" y="311" font-size="11" fill="#667085">attached</text>
      </g>
    </g>
  </g>
</svg>
