# Smart Support Desk (Predigle) - https://predigle.arunsanjeev.dev
#
# Installed on the VPS as /etc/nginx/sites-available/predigle and enabled with
#   ln -s /etc/nginx/sites-available/predigle /etc/nginx/sites-enabled/predigle
#
# The Angular build is served straight from disk (the "current" release), while
# /api/ and /admin/ are proxied to Django (Gunicorn, see deploy/systemd), which only listens on
# 127.0.0.1:8010 and is never reachable from outside.

upstream predigle_backend {
    server 127.0.0.1:8010;
    keepalive 8;
}

# Lets WebSocket upgrades through while keeping upstream keep-alive for normal requests.
map $http_upgrade $predigle_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name predigle.arunsanjeev.dev;

    access_log /var/log/nginx/predigle.access.log;
    error_log  /var/log/nginx/predigle.error.log warn;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/predigle/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://predigle.arunsanjeev.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name predigle.arunsanjeev.dev;

    ssl_certificate     /etc/letsencrypt/live/predigle.arunsanjeev.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/predigle.arunsanjeev.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/predigle.access.log;
    error_log  /var/log/nginx/predigle.error.log warn;

    root  /var/www/predigle/current/frontend;
    index index.html;

    client_max_body_size 60m;  # up to 5 attachments of 10 MB per upload
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Shared by every proxied location below
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $predigle_connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/predigle/acme;
        default_type text/plain;
    }

    # Django REST API and admin
    location ^~ /api/ {
        proxy_pass http://predigle_backend;
    }
    location ^~ /admin/ {
        proxy_pass http://predigle_backend;
    }

    # Django static files (admin + browsable API), collected into each release
    location ^~ /static/ {
        alias /var/www/predigle/current/static/;
        expires 7d;
        access_log off;
    }

    # Angular bundles carry a content hash in their file names, so they can be cached for long
    location ~* \.(?:js|css)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(?:ico|svg|png|jpe?g|gif|webp|woff2?|ttf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
