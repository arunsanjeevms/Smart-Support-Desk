# MongoDB for Smart Support Desk on a small VPS (about 1 GB RAM).
# Installed as /etc/mongod.conf by deploy/server-setup.sh.
storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      # Keep MongoDB's cache small so Django and the AI model fit in memory too.
      cacheSizeGB: 0.25

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  # Only reachable from the server itself - never exposed to the internet.
  bindIp: 127.0.0.1

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
