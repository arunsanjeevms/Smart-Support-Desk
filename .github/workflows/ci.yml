name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Django + MongoDB)
    runs-on: ubuntu-latest

    # A throwaway MongoDB for the test run (locally the project uses your
    # own MongoDB server - Docker is only used here on the CI machine).
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_NAME: smart_support_desk_ci
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "False"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Make sure migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Seed demo data (smoke test)
        run: |
          python manage.py migrate --no-input
          python manage.py seed_demo

  frontend:
    name: Frontend tests and build (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

  notify:
    name: Email the result
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest

    env:
      # Add these two repository secrets (Settings > Secrets and variables > Actions):
      #   MAIL_USERNAME - the Gmail address that sends the mail
      #   MAIL_PASSWORD - a Gmail App Password for that account
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: msarunsanjeev@gmail.com
      RESULT: ${{ (needs.backend.result == 'success' && needs.frontend.result == 'success') && 'passed' || 'failed' }}

    steps:
      - name: Explain missing secrets
        if: env.MAIL_USERNAME == '' || env.MAIL_PASSWORD == ''
        run: echo "::notice::Skipping the result email - add the MAIL_USERNAME and MAIL_PASSWORD repository secrets to enable it."

      - name: Send result email
        if: env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Smart Support Desk CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ env.MAIL_TO }}
          subject: "[Smart Support Desk] CI ${{ env.RESULT }} - ${{ github.ref_name }} @ ${{ github.sha }}"
          convert_markdown: true
          body: |
            ## CI ${{ env.RESULT }}

            | Job | Result |
            |-----|--------|
            | Backend tests (Django + MongoDB) | **${{ needs.backend.result }}** |
            | Frontend tests and build (Angular) | **${{ needs.frontend.result }}** |

            - Repository: ${{ github.repository }}
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Triggered by: ${{ github.actor }} (${{ github.event_name }})

            Full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
